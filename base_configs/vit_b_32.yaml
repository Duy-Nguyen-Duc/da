input_img_size: 384

## model
domain_dis: 
  hidden_dim: 256
  dropout: 0.5

model:
  backbone: 
    type: "vit_b_32"
    in_dim: 768
    hidden_dim: 256
    freeze: True

  patch_size: 32
  attribute_layers: 6
  source:
    vr_dropout: 0.1
    cls_dropout: 0.5
    tau_s: 0.8
    tau_t: 0.8
  target: 
    vr_dropout: 0.1
    cls_dropout: 0.3
    tau: 1.0

optimizer:
  lr: 0.0003
  weight_decay: 0.0001

optimizer_d:
  lr: 0.0001
  weight_decay: 0.0001

optimizer_vr:
  lr: 0.0005
  weight_decay: 0.0001
